name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

env:
  REGISTRY: docker.io
  # El namespace de Docker Hub NO es el usuario de GitHub:
  # usar github.repository_owner daba "malformed HTTP Authorization header" en el login.
  IMAGE_API: ${{ secrets.DOCKERHUB_USERNAME }}/agrolink-api
  IMAGE_WEB: ${{ secrets.DOCKERHUB_USERNAME }}/agrolink-web

jobs:
  lint-and-test:
    name: Lint + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install API deps
        working-directory: ./apps/api
        run: npm ci

      - name: Lint API
        working-directory: ./apps/api
        run: npm run lint

      - name: Typecheck API
        working-directory: ./apps/api
        run: npm run typecheck

      - name: Test + Coverage API (gate >= 60%)
        working-directory: ./apps/api
        run: npm run test:coverage

      - name: Install Web deps
        working-directory: ./apps/web
        run: npm ci

      - name: Lint Web
        working-directory: ./apps/web
        run: npm run lint

      - name: Typecheck Web
        working-directory: ./apps/web
        run: npx tsc --noEmit

      - name: Test + Coverage Web
        working-directory: ./apps/web
        run: npm run test:coverage

      - name: Publicar resumen de cobertura
        if: always()
        run: |
          echo "## Reporte de Cobertura (Vitest v8)" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const fs = require("fs");
            const rows = [];
            for (const [name, p] of [["API (Backend)", "apps/api/coverage/coverage-summary.json"], ["Web (Frontend)", "apps/web/coverage/coverage-summary.json"]]) {
              if (fs.existsSync(p)) {
                const t = JSON.parse(fs.readFileSync(p, "utf8")).total;
                rows.push(`| ${name} | ${t.statements.pct}% | ${t.branches.pct}% | ${t.functions.pct}% | ${t.lines.pct}% |`);
              }
            }
            if (rows.length) {
              console.log("| App | Statements | Branches | Functions | Lines |");
              console.log("|---|---:|---:|---:|---:|");
              console.log(rows.join("\n"));
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Subir artefactos de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage
            apps/web/coverage
          retention-days: 14

  build-images:
    name: Build Docker images
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          tags: ${{ env.IMAGE_API }}:develop-${{ github.sha }}
          load: true

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: ${{ env.IMAGE_WEB }}:develop-${{ github.sha }}
          load: true

  uat:
    name: UAT (Compose + Smoke tests)
    needs: build-images
    runs-on: ubuntu-latest
    # Corre en PR (para que la protección de rama pueda exigirlo como check)
    # y en push a develop/master (donde dispara el flujo de despliegue).
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master'))
    # Sin `services:`: docker-compose.yml ya levanta su propio MySQL en 3306.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load images
        run: |
          docker build -t agrolink-api:uat ./apps/api
          docker build -t agrolink-web:uat ./apps/web

      - name: Start Compose stack
        run: |
          docker compose up -d
          sleep 10

      - name: Smoke test API health
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/salud | grep -q '"ok":true'; then
              echo "API health OK"
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed"
          docker compose logs api
          exit 1

      - name: Smoke test Web
        run: |
          if curl -sf http://localhost:8080/ | grep -q 'AgroLink'; then
            echo "Web OK"
          else
            echo "Web check failed"
            docker compose logs web
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v

  deploy-dev:
    name: Deploy Dev (Cloudflare Workers + Pages)
    needs: uat
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Backend Dev (Cloudflare Worker)
        working-directory: ./apps/api
        run: |
          npm ci
          wrangler deploy --env dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend Dev (Cloudflare Pages)
        working-directory: ./apps/web
        run: |
          npm ci
          VITE_APP_ENV=dev npm run build
          wrangler pages project create agrolink-web --production-branch=master || true
          wrangler pages deploy ./dist --project-name=agrolink-web --branch=develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  push-dockerhub:
    name: Push to Docker Hub
    needs: uat
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Web
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  deploy-prod:
    name: Deploy Prod (Cloudflare Workers + Pages)
    needs: push-dockerhub
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Backend Prod (Cloudflare Worker)
        working-directory: ./apps/api
        run: |
          npm ci
          wrangler deploy --env prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Frontend Prod (Cloudflare Pages)
        working-directory: ./apps/web
        run: |
          npm ci
          VITE_APP_ENV=prod npm run build
          wrangler pages project create agrolink-web --production-branch=master || true
          wrangler pages deploy ./dist --project-name=agrolink-web --branch=master
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
